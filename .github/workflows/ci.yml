name: CI with SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # 🔧 FIX: Tambahkan izin untuk jest sebelum dijalankan
      - name: Fix Jest permission
        run: chmod +x ./node_modules/.bin/jest

      # 🔧 Jalankan test secara langsung lewat node untuk hindari PATH error
      - name: Run tests
        run: node --experimental-vm-modules ./node_modules/jest/bin/jest.js --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
